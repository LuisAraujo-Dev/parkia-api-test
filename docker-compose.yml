services:
  db:
    image: postgres:15
    container_name: parkia_db
    restart: always
    environment:
      POSTGRES_USER: parkia_user
      POSTGRES_PASSWORD: parkia_password
      POSTGRES_DB: parkia_db
    ports:
      - "5444:5432"

  api:
    build: ./parkia-api
    container_name: parkia_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: parkia_user
      DB_PASSWORD: parkia_password
      DB_DATABASE: parkia_db
    depends_on:
      - db

  web:
    build: ./parkia-web
    container_name: parkia_web
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - api